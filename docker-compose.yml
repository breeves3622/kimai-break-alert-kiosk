version: '3.8'

services:
  kimai:
    image: lscr.io/linuxserver/kimai:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - DB_HOST=kimai-db
      - DB_USER=${DB_USER:-kimai}
      - DB_PASS=${DB_PASS:-kimaipassword}
      - DB_NAME=${DB_NAME:-kimai}
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET:-change_me_to_a_random_secret_string}
    volumes:
      - kimai_config:/config
      - kimai_data:/data
    ports:
      - "${KIMAI_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - kimai-db
    networks:
      - kiosk-network

  kimai-db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-kimai}
      - MYSQL_USER=${DB_USER:-kimai}
      - MYSQL_PASSWORD=${DB_PASS:-kimaipassword}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - kiosk-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - kiosk-network

  alert-worker:
    build:
      context: ./alert-worker
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - kiosk-network

networks:
  kiosk-network:
    driver: bridge

volumes:
  kimai_config:
  kimai_data:
  mariadb_data:
